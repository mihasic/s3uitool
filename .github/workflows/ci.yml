name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Lint with Ruff
        run: |
          cd backend
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with Mypy
        run: |
          cd backend
          uv run mypy .

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint with Biome
        run: |
          cd frontend
          bun biome ci .

      - name: Build
        run: |
          cd frontend
          bun run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: s3-sqs-ui:latest
