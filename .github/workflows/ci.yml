name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint with Biome
        run: bun run check:api

      - name: Type check
        run: bun run typecheck:api

      - name: Audit dependencies
        run: bun audit

  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Start S3/SQS emulators
        run: docker compose up -d rustfs elasticmq

      - name: Wait for emulators
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:9000 > /dev/null && curl -s http://localhost:9324 > /dev/null; do sleep 2; done'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        env:
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          AWS_SQS_ENDPOINT_URL: http://localhost:9324
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: bun run test:api

  app-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Lint with Biome
        run: |
          bun run check:app

      - name: Unit tests
        run: |
          bun run --filter app test

      - name: Build
        run: |
          bun run build

      - name: Audit dependencies
        run: |
          bun audit

  e2e-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: e2e
        run: bun run playwright install --with-deps

      - name: Start Docker Stack
        run: docker compose up -d --build

      - name: Wait for Service
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:8000/api/health > /dev/null; do sleep 2; done'

      - name: Seed test data
        env:
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          AWS_SQS_ENDPOINT_URL: http://localhost:9324
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: bun run seed

      - name: Run Playwright tests
        working-directory: e2e
        env:
          APP_PORT: 8000
        run: bun run test
